<svg xmlns="http://www.w3.org/2000/svg" width="495" height="215" viewBox="0 0 495 215" role="img" aria-label="Most used languages">
  <title>Most used languages</title>
  <defs></defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .t { fill: #70a5fd; font-size: 18px; font-weight: 600; }
    .l { fill: #a9b1d6; font-size: 13px; }
    .v { fill: #38bdae; font-size: 14px; font-weight: 700; }
  </style>
  <rect x="0.5" y="0.5" rx="6" width="494" height="214" fill="#1a1b27" stroke="#2a2c3f"/>
  <text x="25" y="35" class="t">Most Used Languages</text>
  <clipPath id="bar"><rect x="25" y="52" width="445" height="10" rx="5"/></clipPath>
  <g clip-path="url(#bar)">
    <rect x="25.0" y="52" width="190.2" height="10" fill="#3572A5"/>
    <rect x="214.7" y="52" width="151.2" height="10" fill="#e34c26"/>
    <rect x="365.3" y="52" width="49.5" height="10" fill="#f1e05a"/>
    <rect x="414.3" y="52" width="45.4" height="10" fill="#663399"/>
    <rect x="459.2" y="52" width="9.0" height="10" fill="#4F5D95"/>
    <rect x="467.7" y="52" width="2.7" height="10" fill="#DA5B0B"/>
    <rect x="469.9" y="52" width="0.5" height="10" fill="#15dcdc"/>
    <rect x="470.0" y="52" width="0.5" height="10" fill="#565f89"/>
  </g>
  <circle cx="30" cy="88" r="5" fill="#3572A5"/>
  <text x="42" y="92" class="l">Python</text>
  <text x="230" y="92" class="v" text-anchor="end">42.6%</text>
  <circle cx="255" cy="88" r="5" fill="#e34c26"/>
  <text x="267" y="92" class="l">HTML</text>
  <text x="455" y="92" class="v" text-anchor="end">33.9%</text>
  <circle cx="30" cy="116" r="5" fill="#f1e05a"/>
  <text x="42" y="120" class="l">JavaScript</text>
  <text x="230" y="120" class="v" text-anchor="end">11.0%</text>
  <circle cx="255" cy="116" r="5" fill="#663399"/>
  <text x="267" y="120" class="l">CSS</text>
  <text x="455" y="120" class="v" text-anchor="end">10.1%</text>
  <circle cx="30" cy="144" r="5" fill="#4F5D95"/>
  <text x="42" y="148" class="l">PHP</text>
  <text x="230" y="148" class="v" text-anchor="end">1.9%</text>
  <circle cx="255" cy="144" r="5" fill="#DA5B0B"/>
  <text x="267" y="148" class="l">Jupyter Notebook</text>
  <text x="455" y="148" class="v" text-anchor="end">0.5%</text>
  <circle cx="30" cy="172" r="5" fill="#15dcdc"/>
  <text x="42" y="176" class="l">VBScript</text>
  <text x="230" y="176" class="v" text-anchor="end">0.0%</text>
  <circle cx="255" cy="172" r="5" fill="#565f89"/>
  <text x="267" y="176" class="l">Other</text>
  <text x="455" y="176" class="v" text-anchor="end">0.0%</text>
</svg>
